function metrics(){const values=[['48','运行次数','候选指标 · 样例'],[state.edge?'未知':'$0.87','费用',state.edge?'缺少费用依据':'另有 2 次费用未知'],['2.6s','响应耗时','候选指标 · 样例'],['61%','检索比例','候选指标 · 样例'],['126','记忆条目','候选指标 · 样例']];return `<div class="metrics">${values.map(([value,label,note],i)=>`<div class="card metric ${state.edge&&i===1?'edge-value':''}"><div class="metric-value">${value}</div><div class="metric-label">${label}</div><div class="metric-note">${note}</div></div>`).join('')}</div>`;}
function architecture(vertical=false){vertical=vertical||innerWidth<=700;return `<section class="card"><div class="card-heading"><div><div class="eyebrow">ARCHITECTURE</div><h2 style="margin-top:4px">理解 Agent 如何协作</h2><p>静态说明 · 非本次运行的执行路径</p></div></div><div class="architecture ${vertical?'vertical':'compact'}" role="region" tabindex="0" aria-label="静态架构说明，可横向滚动">${vertical?`<svg viewBox="0 0 290 382" role="img" aria-label="静态样例：入口、Agent、模型与工具，工作记忆与长期记忆"><defs><marker id="arrow-v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path fill="#696877" d="M0 0L8 4L0 8"/></marker></defs><path class="edge" marker-end="url(#arrow-v)" d="M145 70v28 M145 164v28 M145 260v30"/><rect class="node" x="28" y="10" width="234" height="60" rx="9"/><text x="44" y="35">入口 Gateway</text><text class="note" x="44" y="55">CLI · Web</text><rect class="node agent" x="28" y="98" width="234" height="66" rx="9"/><text x="44" y="125">Agent</text><text class="note" x="44" y="147">Run → Step → Attempt</text><rect class="node" x="28" y="192" width="234" height="68" rx="9"/><text x="44" y="219">模型与工具</text><text class="note" x="44" y="242">ModelClient · ToolRegistry</text><rect class="node" x="28" y="290" width="234" height="72" rx="9"/><text x="44" y="317">上下文与记录</text><text class="note" x="44" y="340">工作记忆 · 长期记忆 · 运行记录</text></svg>`:`<svg viewBox="0 0 730 224" role="img" aria-label="静态样例：入口连接 Agent，Agent 调用模型与工具，使用工作记忆并留下运行记录"><defs><marker id="arrow-h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path fill="#696877" d="M0 0L8 4L0 8"/></marker></defs><rect x="2" y="2" width="726" height="220" rx="12" fill="none" stroke="#34343c" stroke-dasharray="5 5"/><text x="22" y="28" class="caption">AGENT-ALFRED · 本地实例</text><path class="edge" marker-end="url(#arrow-h)" d="M168 88h40 M368 88h40 M568 88h28 M288 120v24 M168 176h40 M448 144v-24"/><rect class="node" x="22" y="56" width="146" height="64" rx="9"/><text x="38" y="82">入口 Gateway</text><text class="note" x="38" y="105">CLI · Web</text><rect class="node agent" x="208" y="56" width="160" height="64" rx="9"/><text x="224" y="82">Agent</text><text class="note" x="224" y="105">Run → Step → Attempt</text><rect class="node" x="408" y="56" width="160" height="64" rx="9"/><text x="424" y="82">模型与工具</text><text class="note" x="424" y="105">ModelClient · Tools</text><rect class="node" x="598" y="56" width="110" height="64" rx="9"/><text x="614" y="82">正式回复</text><text class="note" x="614" y="105">MainBar</text><rect class="node" x="22" y="144" width="146" height="64" rx="9"/><text x="38" y="170">工作记忆</text><text class="note" x="38" y="193">当前上下文</text><rect class="node" x="208" y="144" width="160" height="64" rx="9"/><text x="224" y="170">运行记录</text><text class="note" x="224" y="193">状态与过程证据</text><rect class="node" x="408" y="144" width="300" height="64" rx="9"/><text x="424" y="170">长期记忆</text><text class="note" x="424" y="193">持久事实与可检索内容</text></svg>`}<p class="architecture-caption">此图用于比较布局；关系与指标的最终内容由 Overview 数据规格确定。图中没有实时高亮。</p></div></section>`;}
function runTable(limit=4){const rows=records().filter(r=>`${r.title} ${r.id}`.includes(state.query)).slice(0,limit);return `<div class="table-scroll" role="region" tabindex="0" aria-label="运行样例表，可横向滚动"><table class="run-table"><thead><tr><th scope="col">Run / 时间</th><th scope="col">内容摘要</th><th scope="col">结局</th><th scope="col">记录</th><th scope="col">费用</th></tr></thead><tbody>${rows.map(r=>`<tr class="${state.page==='runs'&&state.selected===r.id?'row-selected':''}"><td><button class="link-button" data-run="${r.id}" aria-label="查看 ${r.id} 运行详情">${r.id}</button><div class="row-meta mono">${r.time}</div></td><td class="summary"><div class="row-title">${r.title}</div><div class="row-meta">${r.phase} · 样例</div></td><td>${badge(r.outcome,r.tone)}</td><td>${badge(r.recording,r.recordTone)}</td><td class="mono">${r.cost}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty"><h3>没有匹配的运行样例</h3><p>试试搜索“设计”或“demo”。</p></div>'}</div>`;}
function recent(feed=false){return `<section class="card"><div class="card-heading"><div><h2>最近运行</h2><p>用于比较密度与状态的样例记录</p></div><button class="quiet small" data-page="runs">查看全部 →</button></div>${feed?`<div class="run-feed">${records().slice(0,3).map(r=>`<div class="feed-row"><div class="feed-top"><button class="link-button" data-run="${r.id}">${r.id}</button><span class="small muted mono">${r.time}</span></div><p>${r.title}</p><div class="feed-states">${badge(r.outcome,r.tone)}${badge(r.recording,r.recordTone)}<span class="small muted mono">${r.cost}</span></div></div>`).join('')}</div>`:runTable(4)}</section>`;}
function overview(){const n=state.edge?'<div class="notice"><span aria-hidden="true">!</span><div>部分信息不可用<p>费用缺少依据；最近一条回复已完成，但尚未保存。各状态分别展示。</p></div></div>':'';if(state.variant==='A')return `${n}${metrics()}${architecture()}${recent()}`;if(state.variant==='B')return `${n}${metrics()}${recent()}${architecture()}`;return `${n}<div class="overview-columns"><div class="overview-side">${metrics()}${architecture(true)}</div>${recent(true)}</div>`;}
function detail(){const r=records().find(r=>r.id===state.selected)||records()[0];return `<section class="card" id="run-detail" tabindex="-1" aria-label="运行详情样例"><div class="card-heading"><div><div class="eyebrow">RUN DETAIL</div><h2 style="margin-top:5px">${r.id}</h2></div><span class="sample-chip">只读样例</span></div><div class="detail"><div class="detail-top"><h3>${r.title}</h3></div><dl><div><dt>阶段</dt><dd>${r.phase}</dd></div><div><dt>结局</dt><dd>${badge(r.outcome,r.tone)}</dd></div><div><dt>记录状态</dt><dd>${badge(r.recording,r.recordTone)}</dd></div><div><dt>费用</dt><dd class="mono">${r.cost}</dd></div><div><dt>过程证据</dt><dd>${state.edge?'部分缺失':'可用'} · 样例</dd></div><div><dt>正式回复</dt><dd>在 MainBar 中阅读</dd></div></dl>${r.recording==='未保存'?'<div class="notice"><span aria-hidden="true">!</span><div>回复完成 · 未保存<p>已完成描述运行结局；未保存描述记录状态。两者同时保留。</p></div></div>':''}<div><div class="step"><span class="step-index">01</span><div><h3>Step 1 · 模型响应</h3><p>Attempt 1 · ${r.outcome==='失败'?'失败':'已提交'} · 示例过程</p></div></div><div class="step"><span class="step-index">02</span><div><h3>Step 2 · ${r.outcome==='已完成'?'回复完成':'终态说明'}</h3><p>展示过程与证据状态，正式回复仍归 MainBar。</p></div></div></div></div></section>`;}
function runs(){const list=`<section class="card"><div class="card-heading"><h2>运行记录 <span class="muted small">6 条样例</span></h2><span class="sample-chip">Run / Step / Attempt</span></div>${state.variant==='C'?`<div class="run-feed">${records().map(r=>`<div class="feed-row"><div class="feed-top"><button class="link-button" data-run="${r.id}">${r.id}</button><span class="small muted mono">${r.time}</span></div><p>${r.title}</p><div class="feed-states">${badge(r.outcome,r.tone)}${badge(r.recording,r.recordTone)}</div></div>`).join('')}</div>`:runTable(6)}<div class="table-footer"><span>样例记录，仅用于视觉评审</span><span>费用未知时保留“未知”</span></div></section>`;return `<div class="toolbar"><label for="run-search" class="sr-only">搜索运行样例</label><input id="run-search" placeholder="搜索运行摘要或 Run ID" value="${escapeHTML(state.query)}"><button data-action="search">搜索</button><button class="quiet" data-action="clear-search">清除</button><span class="small muted">内容与状态独立呈现</span></div><div class="run-layout ${state.variant==='C'?'side-detail':''}">${state.variant==='B'?detail()+list:list+detail()}</div>`;}
function components(){return `<div class="card"><div class="card-heading"><div><h2>公共视觉语言</h2><p>跨页复用的颜色、字级、边界与反馈样例</p></div><span class="sample-chip">候选 tokens</span></div><div class="card-content"><div class="swatches">${[['画布','#101012'],['卡片','#141416'],['强调','#7c8aec'],['正文','#ececea'],['辅助文字','#94939e'],['成功','#4cc38a'],['需注意','#e0a458'],['错误','#ff8f9b']].map(([label,color])=>`<div class="swatch"><div class="swatch-color" style="background:${color}"></div>${label}<br><code>${color}</code></div>`).join('')}</div><div class="divider" style="margin:20px 0"></div><div class="token-list"><span>正文 <b>14px</b></span><span>表格 <b>13px</b></span><span>辅助 <b>12px</b></span><span>主标题 <b>27px</b></span><span>间距 <b>4 / 8 / 12 / 16 / 24</b></span><span>圆角 <b>8 / 12px</b></span></div></div></div><div class="state-gallery"><div class="state-stack"><section class="card"><div class="card-heading"><h2>状态同时成立</h2></div><div class="card-content"><div><p class="small muted" style="margin-bottom:8px">Run 结局与记录状态</p><div class="badge-list">${badge('已完成','good')}${badge('未保存','warning')}${badge('证据部分缺失','warning')}</div></div><div><p class="small muted" style="margin-bottom:8px">连接观测与模型支持</p><div class="badge-list">${badge('已连接','good')}${badge('支持情况未知','dim')}</div></div><div><p class="small muted" style="margin-bottom:8px">进行中与未知</p><div class="badge-list">${badge('运行中','active')}${badge('费用未知','dim')}${badge('观测已过期','warning')}</div></div></div></section><div class="notice danger"><span aria-hidden="true">×</span><div>加载失败<p>保留错误说明与重试入口，不把失败显示成空列表。</p><button class="quiet small" data-action="retry">重试样例</button></div></div><div class="notice info"><span aria-hidden="true">i</span><div>连接已断开<p>已有内容仍可阅读；后续状态等待重新连接确认。</p></div></div><div class="notice"><span aria-hidden="true">!</span><div>显示上次获取的结果<p>这份观测已过期，更新时间与过期标记同时保留。</p></div></div><section class="card"><div class="card-content"><h3>加载中</h3><p class="small muted">正在读取样例记录…</p><div class="loading-line"></div><div class="loading-line"></div></div></section><section class="card"><div class="empty"><h3>尚无运行记录</h3><p>这是明确的空状态；不表示请求失败或费用为零。</p></div></section></div><div class="state-stack"><section class="card"><div class="card-heading"><h2>表单与操作</h2></div><div class="card-content"><div class="form-stack"><label>示例名称<input value="默认配置 · 样例" placeholder="输入名称"></label><label>示例选择<select><option>选项一</option><option>选项二</option></select></label><label>无效输入<input class="invalid" aria-invalid="true" aria-describedby="field-error" value=""></label><span id="field-error" class="error-text">请输入一个名称；错误紧邻字段。</span><span class="hint">说明常驻可读；不会只靠占位符解释输入。</span><div class="toolbar"><button class="primary" data-action="save-example">保存样例</button><button data-action="cancel-example">取消</button><button disabled>不可用</button></div><div class="notice"><div>操作暂不可用<p>在这里说明禁用原因，不要求用户猜测。</p></div></div></div></div></section><section class="card"><div class="card-heading"><h2>键盘与长内容</h2></div><div class="card-content"><p>使用 Tab 查看焦点。按钮、链接、表单和横向滚动区域都有清晰焦点。</p><p class="small muted" style="margin-top:12px">说明、错误和正文可换行。表格保留局部横向滚动；关键结局和记录状态不会被省略号吞掉。</p><div class="toolbar" style="margin-top:16px"><button data-action="focus-chat">聚焦主对话输入</button></div></div></section></div></div>`;}
function chat(){return `<aside class="chat" aria-label="MainBar 主对话样例"><div class="chat-top"><div class="chat-heading"><strong>主对话 <span class="muted small mono">MainBar</span></strong><button class="quiet desktop-close" data-action="collapse-chat">收起</button><button class="quiet close-panel" data-action="close-panel">返回页面</button></div><div class="small">设计讨论 · 示例会话</div><div class="chat-meta">${badge(state.edge?'连接中断':'连接已建立',state.edge?'warning':'dim')}<span class="sample-chip">样例</span></div></div><div class="chat-messages"><div class="message user">整理一下今天的项目进展，再列出接下来需要确认的事项。</div><div class="message assistant"><div class="message-body">已把进展整理成两部分：已完成的工作，以及仍需确认的事项。<br><br>先看关键状态，再进入运行详情查看过程证据。</div><div class="message-note">Run demo-048 · 2 Step<br>${badge('回复完成','good')} ${badge(state.edge?'未保存':'已保存',state.edge?'warning':'dim')}</div></div><div class="message user">如果某次运行的费用暂时取不到，应该怎么显示？</div><div class="message assistant"><div class="message-body">明确显示“未知”，并保留原因。已有金额与缺失费用分别呈现。<pre>费用：未知\n原因：缺少费用依据</pre></div><div class="message-note">示例回答 · 未调用模型</div></div></div>${state.edge?'<div class="notice chat-notice"><div>连接已断开<p>内容可读；草稿保留。连接恢复规则由壳层规格确定。</p></div></div>':''}<div class="compose"><label for="chat-draft">消息草稿</label><textarea id="chat-draft" rows="2" placeholder="写下消息…">${escapeHTML(state.draft)}</textarea><div class="compose-row"><span class="small">原型仅在内存保留草稿</span><button class="primary" data-action="preview-send">预览发送</button></div>${state.notice?`<p class="small" role="status" style="margin-top:8px;color:var(--amber)">${state.notice}</p>`:''}</div></aside>`;}
function updateURL(){const url=new URL(location.href);url.searchParams.set('variant',state.variant);url.searchParams.set('page',state.page);url.searchParams.set('state',state.edge?'edge':'normal');try{history.replaceState(null,'',url);}catch{}}
function render(){const title={overview:'总览',runs:'运行',components:'公共组件与状态'}[state.page];document.title=`${state.variant} · ${title} · Agent-Alfred 视觉原型`;document.getElementById('app').innerHTML=`<div class="shell variant-${state.variant} ${state.chatHidden?'chat-hidden':''} ${state.panel?state.panel+'-open':''}"><nav class="rail" aria-label="页面导航样例"><button class="quiet close-panel" data-action="close-panel">返回页面</button><div class="brand"><div class="brand-name">Agent-Alfred<span style="color:var(--accent)">.</span></div><div class="small">你的本地私人助手</div><div class="instance"><span class="dot" aria-hidden="true"></span>本地实例 · 样例</div></div><div class="nav-group eyebrow">工作空间</div><div class="nav-items">${navigation.slice(0,6).map(([key,label,symbol])=>`<button class="nav-item" ${['overview','runs'].includes(key)?`data-page="${key}"`:'disabled title="该页不在代表性原型中"'} ${state.page===key?'aria-current="page"':''}>${icon(symbol)}<span>${label}</span>${key==='runs'?'<span class="nav-count">48</span>':''}</button>`).join('')}</div><div class="nav-group eyebrow">管理与诊断</div><div class="nav-items">${navigation.slice(6).map(([key,label,symbol])=>`<button class="nav-item" disabled title="该页不在代表性原型中">${icon(symbol)}<span>${label}</span></button>`).join('')}</div><div class="rail-footer"><strong>样例工作空间</strong>导航名称与分组仅作占位<br>其余页面保留原有能力</div></nav><div class="workspace"><div class="mobile-top"><button data-action="open-nav">☰ 导航</button><strong>Agent-Alfred</strong><button data-action="open-chat">主对话</button></div><main><header class="page-header"><div><div class="eyebrow">AGENT WORKSPACE</div><h1 id="page-title" tabindex="-1">${title}</h1><p>${{overview:'了解当前实例，继续你的工作。',runs:'从一条请求，查看完整的运行过程。',components:'检查日常操作与边界状态的共同表达。'}[state.page]}</p></div><div class="header-actions"><span class="sample-chip">${state.edge?'边界状态样例':'常规状态样例'}</span><button class="reopen" data-action="open-chat">展开主对话</button></div></header><div class="page-body">${state.page==='overview'?overview():state.page==='runs'?runs():components()}</div></main></div>${chat()}</div>`;document.getElementById('review-controls').innerHTML=`<div class="review-dock" role="region" aria-label="原型评审工具"><button data-action="previous" aria-label="上一个方案">←</button><span class="dock-label">${state.variant} · ${variants[state.variant]}</span><button data-action="next" aria-label="下一个方案">→</button><span class="dock-sep"></span><div class="view-controls"><button data-page="overview" aria-pressed="${state.page==='overview'}">总览</button><button data-page="runs" aria-pressed="${state.page==='runs'}">运行</button><button data-page="components" aria-pressed="${state.page==='components'}">组件</button><label><span class="sr-only">样例状态</span><select class="state-select" id="state-select"><option value="normal" ${state.edge?'':'selected'}>常规状态</option><option value="edge" ${state.edge?'selected':''}>边界状态</option></select></label></div><span class="viewport-readout">${innerWidth} × ${innerHeight}</span></div><div class="readout" aria-hidden="true">${state.variant} / ${state.page} / ${state.edge?'edge':'normal'} / ${state.panel||'page'}</div>`;updateURL();}
function announce(text){document.getElementById('announcements').textContent=text;}
function cycle(delta){const keys=Object.keys(variants);state.variant=keys[(keys.indexOf(state.variant)+delta+keys.length)%keys.length];render();announce(`方案 ${state.variant}，${variants[state.variant]}。${state.edge?'边界':'常规'}状态。`);}
document.addEventListener('input',event=>{if(event.target.id==='chat-draft')state.draft=event.target.value;if(event.target.id==='run-search')state.query=event.target.value;});
document.addEventListener('change',event=>{if(event.target.id==='state-select'){state.edge=event.target.value==='edge';render();document.getElementById('state-select').focus();announce(state.edge?'显示边界状态样例':'显示常规状态样例');}});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.page){state.page=button.dataset.page;state.panel=null;render();document.getElementById('page-title').focus();return;}if(button.dataset.run){state.page='runs';state.selected=button.dataset.run;state.panel=null;render();document.getElementById('run-detail').focus();return;}const action=button.dataset.action;if(action==='previous'||action==='next'){cycle(action==='next'?1:-1);document.querySelector(`[data-action="${action}"]`).focus();return;}if(action==='open-chat'||action==='focus-chat'){state.chatHidden=false;state.panel=innerWidth<=1100?'chat':null;render();document.getElementById('chat-draft').focus();return;}if(action==='open-nav'){state.panel='nav';render();document.querySelector('.rail .close-panel').focus();return;}if(action==='collapse-chat'){state.chatHidden=true;render();document.querySelector('.reopen').focus();return;}if(action==='close-panel'){const previous=state.panel;state.panel=null;render();document.querySelector(`[data-action="${previous==='nav'?'open-nav':'open-chat'}"]`).focus();return;}if(action==='search'||action==='clear-search'){if(action==='clear-search')state.query='';render();document.getElementById('run-search').focus();return;}if(action==='preview-send'){state.notice='这里只预览发送按钮；没有发送请求，草稿已保留。';render();document.getElementById('chat-draft').focus();announce(state.notice);return;}if(action==='retry'||action==='save-example'||action==='cancel-example'){announce('这是视觉样例，未更改任何数据。');button.textContent=action==='retry'?'仍为失败样例':'样例反馈已显示';}});
document.addEventListener('keydown',event=>{const editing=event.target.closest('input,textarea,select,[contenteditable],.table-scroll,.architecture');if(!editing&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);}if(event.key==='Escape'&&state.panel){const previous=state.panel;state.panel=null;render();document.querySelector(`[data-action="${previous==='nav'?'open-nav':'open-chat'}"]`).focus();}});
matchMedia('(max-width:700px)').addEventListener('change',()=>render());
addEventListener('resize',()=>{const readout=document.querySelector('.viewport-readout');if(readout)readout.textContent=`${innerWidth} × ${innerHeight}`;});
render();
</script>
</body>
</html>
