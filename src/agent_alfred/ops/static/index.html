<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent-Alfred</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="stylesheet" href="/assets/settings.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <header class="site-header" aria-label="导航面板">
      <a class="brand" href="/inbox">Agent-Alfred<span>本地助手</span></a>
      <div class="panel-actions"><button data-close-panel>关闭导航</button><button data-open-panel="mainbar">打开主对话</button></div>
      <nav aria-label="主导航"></nav>
      <p class="rail-note">本地优先 · 共享运行宿主</p>
    </header>
    <div id="workspace">
      <div id="shell-toolbar" aria-label="壳层状态与操作">
        <button data-open-panel="navigation">打开导航</button>
        <button data-open-panel="mainbar">打开主对话</button>
        <section id="shell-status" aria-label="运行与连接摘要" aria-live="polite"></section>
      </div>
      <main id="page"><h1 tabindex="-1">正在同步 Dashboard…</h1></main>
    </div>
    <button id="panel-shade" aria-label="关闭导航遮罩" hidden></button>
    <section id="mainbar" aria-label="MainBar">
      <div class="bar-heading">
        <h2 id="mainbar-title" tabindex="-1">主对话</h2>
        <button id="toggle" data-close-panel aria-controls="mainbar">收起主对话</button>
      </div>
      <div class="panel-actions"><button data-open-panel="navigation">打开导航</button></div>
      <aside id="connection" aria-label="本标签页连接状态"></aside>
      <section id="busy" aria-label="当前运行" hidden></section>
      <div class="bar-session"><span id="session-name">尚未选择会话</span><button id="new-session" disabled>新建会话</button></div>
      <p id="storage-warning" role="status"></p>
      <p id="reading-status" role="status"></p>
      <button id="retry-location" hidden>重新定位正文</button>
      <button id="return-latest" hidden>回到最新</button>
      <section id="conversation" aria-label="主对话" tabindex="0">
        <button id="older" hidden>更早的消息</button>
        <div id="messages"></div>
      </section>
      <p id="error" role="status"></p>
      <form id="compose">
        <label for="message">消息</label>
        <textarea id="message" rows="3" placeholder="写下消息；/skills 指定流程…" disabled></textarea>
        <button id="send" disabled>发送</button>
      </form>
      <p id="send-reason"></p>
    </section>
    <div id="announcements" class="sr-only" role="status" aria-live="polite"></div>
    <div id="alerts" class="sr-only" role="alert"></div>
  </body>
</html>
