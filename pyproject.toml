[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-alfred"
version = "0.1.0"
description = "Local-first single-user private AI assistant"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.0.0",
    "openai>=3.3.1",
    "httpx2==2.12.0",
    "httpcore2==2.12.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "markdown-it-py>=4.2,<5",
]

[project.optional-dependencies]
p2 = [
    "boto3>=1.42,<2",
]
# MCP transport remains stdlib; declaration/result validation is optional.
mcp = [
    "jsonschema>=4.25,<5",
    "referencing>=0.36,<1",
]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]
# Placeholder extra: `pip install 'agent-alfred[search]'` currently pulls
# no additional packages. Tavily is stdlib HTTP; fill this extra when a
# real SDK is wired in. The name exists so the registry can point at it.
search = []
dev = [
    "boto3>=1.42,<2", # Offline P2 SDK request and error-contract tests.
    "ruff==0.16.4",
    "pytest>=9.1.1",
]

[project.scripts]
agent-alfred = "agent_alfred.gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_alfred"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]
# Root-only. "docs" matches any nested docs/; "/docs" is an absolute
# filesystem path in Ruff 0.16.4 and would not exclude the repo docs/.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]

[tool.ruff.lint.isort]
known-first-party = ["agent_alfred"]

[tool.pytest.ini_options]
testpaths = ["src/agent_alfred/evals/deterministic"]
# Keyed tests must never become a default (CI) requirement. Directory
# testpaths is a second line of defence, not the only one.
addopts = ["-m", "not requires_key"]
markers = [
    "requires_key: needs a named environment variable (API key); skip if unset, never fail the default run",
]

[tool.hatch.build.targets.sdist]
exclude = ["/tmp", "/output", "/node_modules", "/.venv"]
