name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint / skills / env / tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Offline routing regressions compare against a pinned ancestor.
          fetch-depth: 0

      - name: Install CPython with shared SQLite API
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"

      - name: Install uv (Python 3.14)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install package (dev and mcp extras)
        run: uv sync --python "${{ steps.python.outputs.python-path }}" --extra dev --extra mcp --locked

      - name: Pure interpreter control without Database imports
        run: |
          ls -l .venv/bin/python
          readlink -f .venv/bin/python
          timeout --kill-after=5s 10s .venv/bin/python -u -c 'import sys; print(sys.executable); print(sys.version); print("CI01_STDLIB_CONTROL_COMPLETE", flush=True)'

      - name: Stdlib SQLite and empty environment child boundaries
        run: timeout --kill-after=5s 15s .venv/bin/python -u scripts/diagnose_runtime.py

      - name: Public HTTP and worker with process-group observation
        run: timeout --kill-after=5s 30s .venv/bin/python -u scripts/diagnose_issue66.py

      - name: First failed tests and same-engine proof with signal observation
        run: timeout --kill-after=5s 40s .venv/bin/python -u scripts/diagnose_pytest.py
