name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint / skills / env / tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Offline routing regressions compare against a pinned ancestor.
          fetch-depth: 0

      - name: Install uv (Python 3.14)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install package (dev and mcp extras)
        run: uv sync --extra dev --extra mcp --locked

      - name: Lint
        run: uv run ruff check

      - name: Skill validation
        run: uv run python scripts/check_skills.py

      - name: .env.example consistency check
        run: uv run python scripts/check_env_example.py

      - name: Offline deterministic tests
        run: |
          uv run python scripts/diagnose_issue66.py
          uv run --extra mcp pytest -x -vv -s src/agent_alfred/evals/deterministic/test_database_boundaries.py::test_mapped_error_checks_raw_source_before_mapping

      - name: Build distributions
        run: uv build

      - name: Verify base and MCP artifact installations
        run: uv run python scripts/check_mcp_installations.py --output /tmp/mcp-artifacts.json

      - name: Install Node for Dashboard checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dashboard test tools
        run: npm ci --ignore-scripts

      - name: Dashboard typecheck
        run: npm run typecheck

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Offline Dashboard browser tests
        run: npm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: output/playwright/results/
          retention-days: 7
          if-no-files-found: ignore
