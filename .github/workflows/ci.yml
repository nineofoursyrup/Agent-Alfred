name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint / skills / env / tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Python 3.14)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install package (dev extra)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Skill validation
        run: uv run python scripts/check_skills.py

      - name: .env.example consistency check
        run: uv run python scripts/check_env_example.py

      - name: Offline deterministic tests
        run: uv run pytest
