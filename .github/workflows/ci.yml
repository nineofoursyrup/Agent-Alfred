name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint / skills / env / tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Offline routing regressions compare against a pinned ancestor.
          fetch-depth: 0

      - name: Install CPython with shared SQLite API
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"

      - name: Install uv (Python 3.14)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install package (dev and mcp extras)
        run: uv sync --python "${{ steps.python.outputs.python-path }}" --extra dev --extra mcp --locked

      - name: First Database failure and runtime evidence
        run: |
          uv run python scripts/diagnose_issue66.py
          uv run --extra mcp pytest -x -vv -s src/agent_alfred/evals/deterministic/test_database_boundaries.py::test_mapped_error_checks_raw_source_before_mapping src/agent_alfred/evals/deterministic/test_database_console_sql.py::test_hard_heap_limit_applies_only_in_worker_process src/agent_alfred/evals/deterministic/test_database_console_sql.py::test_packaged_worker_entry_executes_select
